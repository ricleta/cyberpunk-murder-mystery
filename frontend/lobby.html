<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Lobby - Cyberpunk Murder Mystery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1 id="sessionNameTitle">Lobby</h1>
            <nav class="nav-links" aria-label="Page">
                <a href="dashboard.html">Back to Dashboard</a>
            </nav>
        </header>

        <div id="alertBox" aria-live="polite" aria-atomic="true"></div>

        <section class="panel" style="text-align: center;" aria-labelledby="joinCodeHeading">
            <h2 id="joinCodeHeading">Join Code</h2>
            <p id="joinCodeDisplay" class="join-code">---</p>
            <div id="joinCodeActions"></div>
        </section>

        <section id="playerPanel" class="panel" hidden aria-labelledby="playerHeading">
            <h2 id="playerHeading">Your Status</h2>
            <div id="playerStatus"></div>
        </section>

        <section class="panel" aria-labelledby="membersHeading">
            <h2 id="membersHeading">Connected Users</h2>
            <div id="membersList"></div>
        </section>

        <section id="gmPanel" class="panel panel-gm" hidden aria-labelledby="generationHeading">
            <h2 id="generationHeading">Game Generation</h2>
            <div id="generationPanel"></div>
        </section>
    </main>

    <script type="module" src="js/pages/lobby.js"></script>
</body>
</html>
