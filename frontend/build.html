<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Builder - Cyberpunk Murder Mystery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1>Character Builder</h1>
            <nav class="nav-links" aria-label="Page">
                <a href="#" id="viewSheetLink">View Character Sheet</a>
                <a href="#" id="backLink">Back to Lobby</a>
            </nav>
        </header>

        <div id="alertBox" aria-live="polite" aria-atomic="true"></div>
        <div id="lockedBanner"></div>

        <section class="panel role-bar" aria-label="Role">
            <div class="role-pick">
                <label for="rolePicker">Role</label>
                <select id="rolePicker" disabled>
                    <option value="">-- Choose Role --</option>
                </select>
            </div>
            <div id="completionTracker" class="incomplete" role="status">Loading...</div>
        </section>

        <div id="builderStatus"></div>

        <div id="builderContent" hidden>
            <section class="builder-section" aria-labelledby="sharedHeading">
                <h2 id="sharedHeading">Shared Lifepath</h2>
                <div id="sharedFieldsContainer"></div>
            </section>

            <section class="builder-section" aria-labelledby="factionHeading">
                <h2 id="factionHeading">Friends &amp; Enemies</h2>
                <div class="faction-columns">
                    <div>
                        <h3>Friend Faction</h3>
                        <div id="friendFactionContainer"></div>
                    </div>
                    <div>
                        <h3>Enemy Faction</h3>
                        <div id="enemyFactionContainer"></div>
                    </div>
                </div>
            </section>

            <section class="builder-section" aria-labelledby="roleSpecificHeading">
                <h2 id="roleSpecificHeading">Role-Specific Lifepath</h2>
                <div id="roleSpecificContainer"></div>
            </section>
        </div>
    </main>

    <script type="module" src="js/pages/build.js"></script>
</body>
</html>
