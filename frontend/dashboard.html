<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Cyberpunk Murder Mystery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1>Dashboard</h1>
            <button id="logoutBtn" class="secondary-btn inline-btn" type="button">Logout</button>
        </header>

        <div id="alertBox" aria-live="polite" aria-atomic="true"></div>

        <div class="character-grid">
            <section class="panel" aria-labelledby="joinHeading">
                <h2 id="joinHeading">Join Session</h2>
                <form id="joinForm">
                    <label for="joinCode">Join code</label>
                    <input type="text" id="joinCode" maxlength="6" autocomplete="off" autocapitalize="characters"
                           style="text-transform: uppercase;" required>
                    <button type="submit" id="joinSubmit">Join</button>
                </form>
            </section>

            <section class="panel" aria-labelledby="createHeading">
                <h2 id="createHeading">Create Session</h2>
                <form id="createForm">
                    <label for="sessionName">Session name</label>
                    <input type="text" id="sessionName" maxlength="80" autocomplete="off" required>
                    <button type="submit" id="createSubmit">Create New Session</button>
                </form>
            </section>
        </div>

        <section class="panel" style="margin-top: 20px;" aria-labelledby="mySessionsHeading">
            <h2 id="mySessionsHeading">My Sessions</h2>
            <div id="mySessions"></div>
        </section>
    </main>

    <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
