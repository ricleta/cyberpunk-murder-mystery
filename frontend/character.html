<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Sheet - Cyberpunk Murder Mystery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1>Character Sheet: <span id="charNameDisplay">Loading...</span></h1>
            <nav class="nav-links" aria-label="Page">
                <a href="#" id="backLink">Back to Lobby</a>
            </nav>
        </header>

        <div id="alertBox" aria-live="polite" aria-atomic="true"></div>
        <div id="sheetStatus"></div>

        <div id="sheet" hidden>
            <div class="toolbar no-print">
                <button id="saveBtn" type="button">Save changes</button>
                <a id="editLifepathLink" class="button-link" href="#">Edit Lifepath</a>
            </div>

            <div class="character-grid" style="margin-bottom: 20px;">
                <section class="sheet-section" aria-labelledby="descriptionHeading" style="margin-bottom: 0;">
                    <h2 id="descriptionHeading">Description</h2>
                    <label for="displayName">Character name</label>
                    <input type="text" id="displayName" maxlength="50" autocomplete="off" aria-describedby="nameError">
                    <p id="nameError" class="field-error" hidden></p>
                    <p>Role: <strong id="roleDisplay" class="role-tag">...</strong></p>
                    <label for="description" style="margin-top: 12px;">Description / backstory</label>
                    <textarea id="description" rows="6" maxlength="4000" aria-describedby="descriptionError composeHint"></textarea>
                    <p id="descriptionError" class="field-error" hidden></p>
                    <div class="no-print">
                        <button id="composeBtn" type="button" class="secondary-btn inline-btn" aria-describedby="composeHint">Compose from Lifepath</button>
                        <p id="composeHint" class="muted" style="margin: 8px 0 0; font-size: 0.85rem;">
                            Suggests a description and traits from your Lifepath. Nothing is saved until you click Save changes.
                        </p>
                    </div>
                </section>

                <section class="sheet-section" aria-labelledby="traitsHeading" style="margin-bottom: 0;">
                    <h2 id="traitsHeading">Traits</h2>
                    <label for="traits">Traits (separated by commas)</label>
                    <textarea id="traits" rows="5" aria-describedby="traitsError"></textarea>
                    <p id="traitsError" class="field-error" hidden></p>
                    <p class="muted" style="font-size: 0.85rem;">Up to 20 traits, 60 characters each.</p>
                </section>
            </div>

            <section class="sheet-section" aria-labelledby="secretsHeading">
                <h2 id="secretsHeading">Secrets &amp; Lies</h2>
                <div id="secretsList"></div>
            </section>

            <section class="sheet-section" aria-labelledby="relationshipsHeading">
                <h2 id="relationshipsHeading">Relationships</h2>
                <div id="relationshipsList"></div>
            </section>

            <section class="sheet-section" aria-labelledby="objectivesHeading">
                <h2 id="objectivesHeading">Objectives</h2>
                <div id="objectivesList"></div>
                <form id="addObjectiveForm" class="add-objective no-print">
                    <div class="grow">
                        <label for="newObjectiveText" class="visually-hidden">New objective</label>
                        <input type="text" id="newObjectiveText" placeholder="New objective..." maxlength="500" autocomplete="off"
                               aria-describedby="newObjectiveError">
                        <p id="newObjectiveError" class="field-error" hidden></p>
                    </div>
                    <div>
                        <label for="newObjectivePoints" class="visually-hidden">Points</label>
                        <select id="newObjectivePoints">
                            <option value="1">1 pt</option>
                            <option value="2">2 pts</option>
                            <option value="3">3 pts</option>
                        </select>
                    </div>
                    <button type="submit" id="addObjectiveBtn" class="secondary-btn">+ Add Objective</button>
                </form>
            </section>
        </div>
    </main>

    <script type="module" src="js/pages/character.js"></script>
</body>
</html>
