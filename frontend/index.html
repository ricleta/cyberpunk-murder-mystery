<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cyberpunk Murder Mystery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container narrow">
        <h1>System Access</h1>

        <div id="alertBox" aria-live="polite" aria-atomic="true"></div>

        <section class="panel" id="loginPanel" aria-labelledby="loginHeading">
            <h2 id="loginHeading">Login</h2>
            <form id="loginForm">
                <label for="loginUsername">Username</label>
                <input type="text" id="loginUsername" autocomplete="username" required>
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" autocomplete="current-password" required>
                <button type="submit" id="loginSubmit">Authenticate</button>
            </form>
            <p style="margin-top: 15px; font-size: 0.9rem;">
                No account? <a href="#" id="showSignup">Initialize User</a>
            </p>
        </section>

        <section class="panel" id="signupPanel" aria-labelledby="signupHeading" hidden>
            <h2 id="signupHeading">Register</h2>
            <form id="signupForm">
                <label for="signupUsername">Username</label>
                <input type="text" id="signupUsername" autocomplete="username" minlength="3" maxlength="32"
                       pattern="[A-Za-z0-9_.\-]+" aria-describedby="usernameHint" required>
                <p id="usernameHint" class="muted" style="margin: -8px 0 12px; font-size: 0.85rem;">
                    3-32 characters: letters, numbers, underscore, dot or hyphen.
                </p>
                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" autocomplete="new-password" minlength="8"
                       aria-describedby="passwordHint" required>
                <p id="passwordHint" class="muted" style="margin: -8px 0 12px; font-size: 0.85rem;">
                    At least 8 characters.
                </p>
                <button type="submit" id="signupSubmit">Register</button>
            </form>
            <p style="margin-top: 15px; font-size: 0.9rem;">
                Existing user? <a href="#" id="showLogin">Return to Login</a>
            </p>
        </section>
    </main>

    <script type="module" src="js/pages/index.js"></script>
</body>
</html>
